version: "3.9"

services:
   # ----------------------
   # Postgres
   # ----------------------
   postgres:
      image: postgres:alpine3.22
      container_name: techibbie-dev-postgres
      networks:
         - dev-techibbie-net
      ports:
         - "5432:5432"
      environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
      volumes:
         - pgdata:/var/lib/postgresql/data

   # ----------------------
   # MongoDB
   # ----------------------
   mongo:
      image: mongo:latest
      container_name: techibbie-dev-mongo
      networks:
         - dev-techibbie-net
      ports:
         - "27017:27017"
      environment:
         MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
         MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
         MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      volumes:
         - mongodata:/data/db

   # ----------------------
   # LocalStack (S3)
   # ----------------------
   localstack:
      image: localstack/localstack:latest
      container_name: techibbie-dev-localstack
      networks:
         - dev-techibbie-net
      ports:
         - "4566:4566"
         - "4510-4559:4510-4559"
      environment:
         SERVICES: ${LOCALSTACK_SERVICES}
         DEBUG: 1
         AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
         AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
         AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

networks:
   dev-techibbie-net:
      driver: bridge

volumes:
   pgdata:
   mongodata:
